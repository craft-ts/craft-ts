name: Production readiness

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Craft security check
        run: npm run security:check

      - name: Security regression suites
        run: npm run security:test

      - name: Build and smoke-test production artifacts
        run: npm run production:check
